apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: joranvdm/hls-backend:worker

          # 👇 Celery worker command
          command: ["python", "-m", "celery"]
          args:
            - "-A"
            - "celery_app.cel"
            - "worker"
            - "--loglevel=info"
            - "--concurrency=12"

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: REDIS_CACHE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_CACHE_URL
            - name: CELERY_BROKER_URL
              value: redis://redis-broker:6379/0
