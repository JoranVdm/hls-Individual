name: SonarCloud Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python for backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      # 3. Setup Node for frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # 4. Run SonarCloud scan using new recommended action
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          args: >
            -Dsonar.organization=joranvdm
            -Dsonar.projectKey=JoranVdm_hls-Individual
            -Dsonar.sources=backend,frontend/src
            -Dsonar.exclusions=backend/app/videos/**
            -Dsonar.python.version=3.10
            -Dsonar.javascript.node.maxspace=4096
            -Dsonar.qualitygate.wait=false 
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
