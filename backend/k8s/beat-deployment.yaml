apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beat
  template:
    metadata:
      labels:
        app: beat
    spec:
      containers:
        - name: beat
          image: joranvdm/hls-backend:beat

          # 👇 Celery beat command
          command: ["python", "-m", "celery"]
          args:
            - "-A"
            - "celery_app.cel"
            - "beat"
            - "--loglevel=info"

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: REDIS_CACHE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_CACHE_URL
            - name: CELERY_BROKER_URL
              value: redis://redis-broker:6379/0
