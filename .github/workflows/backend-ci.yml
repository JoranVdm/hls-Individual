name: Backend CI with Docker

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build services using Docker Compose
      - name: Build backend and worker images
        run: docker compose -f backend/docker-compose.yml build

      # 4. Start services and wait for health
      - name: Start services and wait
        run: docker compose -f backend/docker-compose.yml up -d --wait

      # 5. Optionally run backend tests
      #- name: Run backend tests
      #  run: docker-compose -f backend/docker-compose.yml run --rm web pytest

      # 6. Finish
      - name: Finish
        run: echo "Docker images built and services are healthy!"
