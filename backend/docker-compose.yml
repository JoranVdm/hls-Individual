version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecret
      POSTGRES_DB: streaming
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app
      - ./app/videos:/app/videos
      - ./app/Cover:/app/Cover
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:mysecret@postgres:5432/streaming
      - CELERY_BROKER_URL=redis://redis:6379/0

  worker:
    build: .
    command: celery -A app.celery_app.celery worker --loglevel=info --concurrency=2
    volumes:
      - ./app:/app
      - ./app/videos:/app/videos
    depends_on:
      - redis
      - postgres
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:mysecret@postgres:5432/streaming
      - CELERY_BROKER_URL=redis://redis:6379/0

volumes:
  pgdata:
