name: Backend CI + DockerHub Push

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub (using secrets)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build the Docker images using Docker Compose
      - name: Build Docker images
        run: docker compose -f backend/docker-compose.yml build

      # 5. Tag and Push images to DockerHub  
      - name: Push Docker images
        run: |
          docker tag backend-web:latest ${{ secrets.DOCKERHUB_USERNAME }}/hls-backend:web
          docker tag backend-worker:latest ${{ secrets.DOCKERHUB_USERNAME }}/hls-backend:worker
          docker tag backend-beat:latest ${{ secrets.DOCKERHUB_USERNAME }}/hls-backend:beat

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hls-backend:web
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hls-backend:worker
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hls-backend:beat

      # 6. (Optional) Run the full compose stack to verify health
      - name: Start services and wait for health
        run: docker compose -f backend/docker-compose.yml up -d --wait

      # 7. Finish
      - name: Finish
        run: echo "Docker images built, pushed to Docker Hub, and services are healthy!"
